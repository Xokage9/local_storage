services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/storage
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: storage
      KEYCLOAK_CLIENT_ID: storage-app
      FILE_STORAGE_PATH: /data/files
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    volumes:
      # Файлы хранятся в папке ./storage_data рядом с проектом (портативно для любой ОС).
      - "./storage_data:/data/files"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: storage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /
    volumes:
      - "./keycloak:/opt/keycloak/data/import"

volumes:
  pgdata:
